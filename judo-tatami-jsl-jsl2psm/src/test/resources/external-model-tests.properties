# External Model Tests Configuration for JSL2PSM
#
# Format: <model-name>=<path-to-jsl-file>[;<param>=<value>]*
#
# Path Resolution:
#   - Relative paths: resolved from module root (judo-tatami-jsl-jsl2psm/)
#
# Optional Parameters:
#   - warmup: Enable warmup run (default: false)
#   - iterations: Number of test iterations (default: 1)
#   - behaviours: Generate CRUD behaviours (default: false)
#   - companions: Comma-separated companion JSL files to load together
#
# Built-in test models (standalone)
actor=src/test/resources/actor/ActorTestModel.jsl;behaviours=true
anonymous-actor=src/test/resources/actor/AnonymousActorTestModel.jsl;behaviours=true
derived-relation=src/test/resources/derived/TestDerivedRelationModel.jsl
derived-parameters=src/test/resources/derived/TestDerivedWithParametersModel.jsl
association-relation=src/test/resources/entity/AssociationRelationTestModel.jsl
default-expression=src/test/resources/entity/TestDefaultExpressionModel.jsl
error=src/test/resources/error/ErrorTestModel.jsl
actions=src/test/resources/operation/ActionsTestModel.jsl;behaviours=true
crud-behaviour=src/test/resources/operation/CrudBehaviourTestModel.jsl;behaviours=true
default-transfer=src/test/resources/transferobject/TestCreateDefaultTransferObjectTypeModel.jsl
mapped-transfer=src/test/resources/transferobject/TestCreateMappedTransferObjectTypeModel.jsl
unmapped-transfer=src/test/resources/transferobject/TestCreateUnmappedTransferObjectTypeModel.jsl
choices=src/test/resources/transferobject/TestTransferObjectChoicesModel.jsl
constructor=src/test/resources/transferobject/TestTransferObjectConstructorModel.jsl

# Models with cross-imports excluded - they require multi-file parsing with
# JslParser.getModelFromFiles() that cannot determine root model. These are
# covered by existing unit tests:
#   derived-expression (imports TestDerivedExpressionModelImport)
#   derived-inherited (TestDerivedExpressionModelInherited)
#   instance-function (imports ImportedTestInstanceFunctionModel)
#   imported-function (imports TestInstanceFunctionModel)
