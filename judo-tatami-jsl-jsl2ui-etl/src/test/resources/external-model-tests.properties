# External Model Tests Configuration for JSL2UI
#
# Format: <model-name>=<path-to-jsl-file>[;<param>=<value>]*
#
# Path Resolution:
#   - Relative paths: resolved from module root (judo-tatami-jsl-jsl2ui/)
#   - Absolute paths: used as-is
#
# Optional Parameters:
#   - companions: Comma-separated companion JSL files to load together
#
# Note: JSL2UI requires UIFrontendDeclaration in the model to produce output.
# Models without frontend declarations will produce empty (but equivalent) UI models.
#
# Ad-hoc testing: use -Djudo.test.discovery.basedir=/path/to/jsl/files

